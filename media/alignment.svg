<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title"><title>Oracle alignment fits to ground truth and then scores on the same pixels</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0c766f"/></marker></defs><rect width="860" height="260" rx="16" fill="#edf4f1"/><g font-family="system-ui,sans-serif" fill="#173b39"><rect x="25" y="83" width="170" height="81" rx="12" fill="white"/><text x="110" y="118" text-anchor="middle" font-size="20">Relative q</text><text x="110" y="144" text-anchor="middle" font-size="16">arbitrary scale</text><path d="M205 122H275" stroke="#0c766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="83" width="210" height="81" rx="12" fill="#0c766f"/><text x="395" y="118" text-anchor="middle" font-size="20" fill="white">Fit a q + b ≈ 1/Z*</text><text x="395" y="144" text-anchor="middle" font-size="16" fill="white">reference is used here</text><path d="M510 122H572" stroke="#0c766f" stroke-width="3" marker-end="url(#arrow)"/><rect x="586" y="83" width="246" height="81" rx="12" fill="white"/><text x="709" y="118" text-anchor="middle" font-size="20">Invert and score</text><text x="709" y="144" text-anchor="middle" font-size="16">against the same Z*</text><text x="185" y="223" font-size="18">Low aligned error does not prove raw meter accuracy</text></g></svg>