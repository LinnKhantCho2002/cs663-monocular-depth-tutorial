<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title"><title>Two differently scaled scenes project along the same rays</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0c766f"/></marker></defs><rect width="860" height="260" rx="16" fill="#edf4f1"/><g font-family="system-ui,sans-serif" fill="#173b39"><circle cx="68" cy="130" r="12" fill="#0c766f"/><text x="24" y="174" font-size="17">Camera</text><path d="M68 130L742 38M68 130L742 222" stroke="#9fb5b1" stroke-width="2"/><path d="M145 66V194" stroke="#0c766f" stroke-width="4"/><text x="112" y="225" font-size="17">Image plane</text><path d="M340 93V167" stroke="#0c766f" stroke-width="12"/><path d="M620 55V205" stroke="#bc713d" stroke-width="12"/><text x="274" y="39" font-size="20">Small, close</text><text x="573" y="39" font-size="20">Larger, farther</text><text x="351" y="224" font-size="17">Same X/Z → same projected size</text></g></svg>