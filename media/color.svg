<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="title"><title>Equal normalized colors can correspond to different raw values</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0c766f"/></marker></defs><rect width="860" height="260" rx="16" fill="#edf4f1"/><g font-family="system-ui,sans-serif" fill="#173b39"><text x="35" y="43" font-size="21">Each map uses its own minimum and maximum</text><text x="35" y="105" font-size="18">Map A: q = 1, 2, 3</text><text x="35" y="177" font-size="18">Map B: q = 10, 20, 30</text><rect x="335" y="70" width="112" height="48" rx="5" fill="#160b39"/><rect x="450" y="70" width="112" height="48" rx="5" fill="#b53679"/><rect x="565" y="70" width="112" height="48" rx="5" fill="#fcf3b1"/><rect x="335" y="142" width="112" height="48" rx="5" fill="#160b39"/><rect x="450" y="142" width="112" height="48" rx="5" fill="#b53679"/><rect x="565" y="142" width="112" height="48" rx="5" fill="#fcf3b1"/><text x="356" y="227" font-size="17">Matching color ≠ matching distance</text></g></svg>