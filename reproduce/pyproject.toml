[project]
name = "cs663-monocular-depth"
version = "0.1.0"
description = "Reproducible Depth Anything V2 tutorial and local demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.6",
  "numpy==2.2.6",
  "Pillow==11.3.0",
  "matplotlib==3.10.7",
  "streamlit==1.50.0",
  "h5py==3.14.0",
  "fsspec[http]==2025.9.0",
  "requests==2.32.5",
  "scipy==1.16.2",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==6.30.1",
  "pytest==8.4.2",
  "torchvision==0.23.0",
  "opencv-python-headless==4.12.0.88",
  "einops==0.8.1",
  "omegaconf==2.3.0",
  "addict==2.4.0",
  "rich==14.2.0",
  "imageio==2.37.0",
  "nbconvert==7.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
